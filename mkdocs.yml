theme:
  name: material
  logo: assets/images/logo-header.png
  favicon: assets/images/favicon.png
  features:
    - navigation.sections
    - content.code.copy
extra_css:
  - assets/stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
