<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Count substitutions up the tree</title>
<desc id="desc">Arrows carry substitution tallies from the leaves toward site 4. A close-up shows that two leaves together can use zero, one, or two substitutions. A change at their parent, site 2, can bring the total to three, which is discarded. The root keeps totals of one or two.</desc>
<defs>
  <g id="bins">
    <path d="M-14 0H94" stroke="#52514e" stroke-opacity=".4"/>
    <text x="0" y="17" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">0</text><text x="40" y="17" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">1</text><text x="80" y="17" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">2</text>
  </g>
</defs>
<style>
  .site circle{fill:white;stroke:#2a78d6;stroke-width:1.8}
  .edge{fill:none;stroke:#2a78d6;stroke-width:1.8;}
  .next{fill:none;stroke:#52514e;stroke-width:1.5;}
</style>
<rect width="900" height="450" fill="white"/>
<!-- Arrowheads point toward the parent at every edge. -->
<g fill="#2a78d6">
  <path d="M209 154l-3.5 7h7Z"/>
  <path d="M191 204l-7.7 1.5 4.2 5.5Z M227 204l3.5 7 4.2-5.5Z"/>
  <path d="M94 299l-6.6 4.3 6 3.6Z M119 299l.6 7.9 6-3.6Z"/>
  <path d="M299 299l-6.6 4.3 6 3.6Z M324 299l.6 7.9 6-3.6Z"/>
</g>
<path d="M734 222l-3-6h6Z M734 311l-3-6h6Z" fill="#52514e"/>
<text class="title" x="450" y="39" font-family="sans-serif" font-size="25" text-anchor="middle" fill="#0b0b0b" font-weight="700">Count substitutions up the tree</text>
<path d="M419 68V422" stroke="#52514e" stroke-opacity=".19" stroke-width="1.5"/>

<!-- The overview and the root tally. -->
<text class="label" x="209" y="81" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="600">At the root, keep 1–2</text>
<g transform="translate(169 132)">
  <rect x="24" y="-36" width="72" height="56" rx="7" fill="#e1f6ed" stroke="#1baf7a" stroke-width="1.3"/>
  <use href="#bins"/>
  <rect x="-9" y="-6" width="18" height="6" rx="3" fill="#52514e" opacity=".36"/>
  <rect x="31" y="-18" width="18" height="18" rx="3" fill="#1baf7a"/>
  <rect x="71" y="-30" width="18" height="30" rx="3" fill="#1baf7a"/>
</g>
<path d="M209 165V155" class="edge"/>
<path d="M112 265L191 204M307 265L227 204M64 349L94 299M149 349L119 299M269 349L299 299M354 349L324 299" class="edge"/>
<g class="site">
  <circle cx="209" cy="190" r="21"/><text x="209" y="195" stroke="none" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">4 U</text>
  <circle cx="106" cy="282" r="22" style="fill:#eaf3ff;stroke-width:2.6"/><text x="106" y="287" stroke="none" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">2 C</text>
  <circle cx="312" cy="282" r="21"/><text x="312" y="287" stroke="none" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">6 C</text>
  <circle cx="53" cy="367" r="21"/><text x="53" y="372" stroke="none" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">1 A</text>
  <circle cx="160" cy="367" r="21"/><text x="160" y="372" stroke="none" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">3 G</text>
  <circle cx="258" cy="367" r="21"/><text x="258" y="372" stroke="none" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">5 A</text>
  <circle cx="365" cy="367" r="21"/><text x="365" y="372" stroke="none" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">7 G</text>
</g>
<text class="muted" x="209" y="421" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#52514e" font-weight="400">Node labels show site and reference letter</text>

<!-- Read the worked example from top to bottom. -->
<text class="label left" x="447" y="81" font-family="sans-serif" font-size="14" text-anchor="start" fill="#0b0b0b" font-weight="600">Close-up of site 2</text>
<text class="muted left" x="447" y="104" font-family="sans-serif" font-size="14" text-anchor="start" fill="#52514e" font-weight="400">Bars show the weight for each count</text>

<text class="label left" x="447" y="151" font-family="sans-serif" font-size="14" text-anchor="start" fill="#0b0b0b" font-weight="600">Child tallies</text>
<text x="668" y="133" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">Site 1</text><text x="800" y="133" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">Site 3</text>
<g transform="translate(628 166)">
    
    <path d="M-14 0H94" stroke="#52514e" stroke-opacity=".4"/>
    <text x="0" y="17" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">0</text><text x="40" y="17" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">1</text><text x="80" y="17" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">2</text>
  
    <rect fill="#2a78d6" x="-9" y="-24" width="18" height="24" rx="3"/>
    <rect fill="#2a78d6" x="31" y="-12" width="18" height="12" rx="3"/>
  </g><g transform="translate(760 166)">
    
    <path d="M-14 0H94" stroke="#52514e" stroke-opacity=".4"/>
    <text x="0" y="17" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">0</text><text x="40" y="17" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">1</text><text x="80" y="17" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">2</text>
  
    <rect fill="#2a78d6" x="-9" y="-24" width="18" height="24" rx="3"/>
    <rect fill="#2a78d6" x="31" y="-12" width="18" height="12" rx="3"/>
  </g>
<path class="next" d="M668 192V199Q668 204 673 204H729"/>
<path class="next" d="M800 192V199Q800 204 795 204H739"/>
<path class="next" d="M734 206V221"/>

<text class="label left" x="447" y="238" font-family="sans-serif" font-size="14" text-anchor="start" fill="#0b0b0b" font-weight="600">Join the two children</text>
<text class="muted left" x="447" y="260" font-family="sans-serif" font-size="14" text-anchor="start" fill="#52514e" font-weight="400">Both can change, giving 2</text>
<g transform="translate(694 258)">
  <use href="#bins"/>
  <rect fill="#2a78d6" x="-9" y="-24" width="18" height="24" rx="3"/>
  <rect fill="#2a78d6" x="31" y="-24" width="18" height="24" rx="3"/>
  <rect fill="#2a78d6" x="71" y="-6" width="18" height="6" rx="3"/>
</g>
<path class="next" d="M734 285V310"/>

<text class="label left" x="447" y="335" font-family="sans-serif" font-size="14" text-anchor="start" fill="#0b0b0b" font-weight="600">Include site 2</text>
<text class="muted left" x="447" y="357" font-family="sans-serif" font-size="14" text-anchor="start" fill="#52514e" font-weight="400">Match adds 0 · change adds 1</text>
<g transform="translate(694 354)">
  <use href="#bins"/>
  <rect fill="#2a78d6" x="-9" y="-20" width="18" height="20" rx="3"/>
  <rect fill="#2a78d6" x="31" y="-30" width="18" height="30" rx="3"/>
  <rect fill="#2a78d6" x="71" y="-15" width="18" height="15" rx="3"/>
  <path d="M94 0H134" stroke="#52514e" stroke-opacity=".4"/>
  <rect x="111" y="-5" width="18" height="5" rx="2.5" fill="#52514e" opacity=".35"/>
  <path d="M113-13L127 1M127-13L113 1" fill="none" stroke="#52514e" stroke-width="1.5"/>
  <text x="120" y="17" class="muted" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#52514e" font-weight="400">≥3</text>
</g>
<text class="muted" x="814" y="391" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#52514e" font-weight="400">Dropped</text>
<path d="M680 386v5h108v-5" fill="none" stroke="#2a78d6" stroke-width="1.5"/>
<text x="734" y="414" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0b0b0b" font-weight="400">Sent to site 4</text>
</svg>
