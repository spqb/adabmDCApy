<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">Two windows, one table</title>
<desc id="desc">References differ at sites three and six. A count table highlights nine cells satisfying both one-to-three substitution windows. The example changes site three then site five, reaching n two, t two.</desc>
<defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#efefed"/><path d="M0 0V7" stroke="#52514e" stroke-opacity=".32" stroke-width="1.5"/></pattern>
  <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#a44723"/></marker>
</defs>
<style>text{font:14px sans-serif;fill:#0b0b0b;text-anchor:middle}.heading{font-size:25px;font-weight:700}.left{text-anchor:start}.chosen{fill:#d7f5e9;stroke:#1baf7a;stroke-width:1.5}.path{fill:none;stroke:#a44723;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="900" height="500" fill="white"/>
<text class="heading" x="450" y="39">Two windows, one table</text>
<text x="225" y="85">1–3 substitutions from each reference</text>
<rect x="187" y="121" width="34" height="98" rx="6" fill="#fff0e9" stroke="#eb6834" stroke-dasharray="4 2"/>
<rect x="313" y="121" width="34" height="98" rx="6" fill="#fff0e9" stroke="#eb6834" stroke-dasharray="4 2"/>
<text y="144"><tspan x="120">1</tspan><tspan x="162">2</tspan><tspan x="204">3</tspan><tspan x="246">4</tspan><tspan x="288">5</tspan><tspan x="330">6</tspan><tspan x="372">7</tspan></text>
<text y="177"><tspan x="70">r₁</tspan><tspan x="120">A</tspan><tspan x="162">C</tspan><tspan x="204">G</tspan><tspan x="246">U</tspan><tspan x="288">A</tspan><tspan x="330">C</tspan><tspan x="372">G</tspan></text>
<text y="206"><tspan x="70">r₂</tspan><tspan x="120">A</tspan><tspan x="162">C</tspan><tspan x="204">U</tspan><tspan x="246">U</tspan><tspan x="288">A</tspan><tspan x="330">G</tspan><tspan x="372">G</tspan></text>
<text class="left" x="68" y="265" font-weight="bold">At sites 3 and 6, add to t</text>
<text class="left" x="68" y="294">r₁ letter</text><text x="261" y="294">0</text>
<text class="left" x="68" y="320">Third letter</text><text x="261" y="320">+1</text>
<text class="left" x="68" y="346">r₂ letter</text><text x="261" y="346">+2</text>
<text class="left" x="68" y="390">Draw</text><text x="237" y="390" letter-spacing="3">A C U U C C G</text>
<text class="left" x="68" y="416">2 substitutions from each reference</text>
<!-- Grid centres (n = 0…3): 542, 616, 690, 764. Rows t = 4…0. -->
<g>
  <path d="M505 105H653V205H579V305H505Z" fill="url(#hatch)"/>
  <path class="chosen" d="M579 205H653V355H579Z M653 155H727V305H653Z M727 105H801V255H727Z"/>
  <path d="M505 105H801V355H505Z M579 105V355 M653 105V355 M727 105V355 M505 155H801 M505 205H801 M505 255H801 M505 305H801" fill="none" stroke="#52514e" stroke-opacity=".48"/>
  <text x="488" y="135">4</text><text x="488" y="185">3</text><text x="488" y="235">2</text><text x="488" y="285">1</text><text x="488" y="335">0</text>
  <text x="542" y="375">0</text><text x="616" y="375">1</text><text x="690" y="375">2</text><text x="764" y="375">3</text>
  <text x="653" y="402">n · substitutions from r₁</text>
  <text x="452" y="230" transform="rotate(-90 452 230)">t · correction</text>
  <path class="path" d="M549 321L608 241"/><path class="path" d="M625 230H678"/>
  <circle cx="542" cy="330" r="5" fill="white" stroke="#a44723" stroke-width="2"/>
  <circle cx="616" cy="230" r="5" fill="white" stroke="#a44723" stroke-width="2"/>
  <circle cx="690" cy="230" r="6" fill="#eb6834" stroke="#a44723" stroke-width="2"/>
  <text x="567" y="284">site 3</text><text x="653" y="219">site 5</text>
</g>
<rect class="chosen" x="505" y="434" width="16" height="16" rx="2"/><text class="left" x="529" y="447">Both windows</text>
<rect x="662" y="434" width="16" height="16" rx="2" fill="url(#hatch)" stroke="#52514e"/><text class="left" x="686" y="447">Unreachable · t &gt; 2n</text>
<rect x="505" y="461" width="16" height="16" rx="2" fill="white" stroke="#52514e"/><text class="left" x="529" y="474">Reachable, outside a window</text>
</svg>
