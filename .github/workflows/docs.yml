name: Generate API Documentation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lazydocs
        pip install -e .

    - name: 🗑️ Clean existing API docs
      run: |
        find docs/api -maxdepth 1 -type f -name '*.md' ! -name 'index.md' -delete
        echo "Removed existing API documentation files"

    - name: 📝 Generate API documentation with lazydocs
      run: |
        # Keep this list aligned with the public modules exposed by adabmDCA.
        # Command-line adapters and private implementation modules are excluded.
        lazydocs \
          --output-path docs/api \
          --overview-file symbols.md \
          --src-base-url "https://github.com/spqb/adabmDCApy/blob/main/" \
          adabmDCA.alphabet \
          adabmDCA.alignment \
          adabmDCA.input_loading \
          adabmDCA.preprocessing \
          adabmDCA.training_config \
          adabmDCA.training_control \
          adabmDCA.api.contacts \
          adabmDCA.api.entropy \
          adabmDCA.api.exceptions \
          adabmDCA.api.input_loading \
          adabmDCA.api.model \
          adabmDCA.api.mutations \
          adabmDCA.api.reintegration \
          adabmDCA.api.results \
          adabmDCA.api.sampling \
          adabmDCA.api.scoring \
          adabmDCA.api.serialization \
          adabmDCA.api.splitting \
          adabmDCA.api.training \
          adabmDCA.checkpoint \
          adabmDCA.cobalt \
          adabmDCA.dataset \
          adabmDCA.dca \
          adabmDCA.fasta \
          adabmDCA.functional \
          adabmDCA.graph \
          adabmDCA.io \
          adabmDCA.plot \
          adabmDCA.resampling \
          adabmDCA.sampling \
          adabmDCA.sampling_triton \
          adabmDCA.statmech \
          adabmDCA.stats \
          adabmDCA.training \
          adabmDCA.utils

        sed -i 's/Overview: symbols.md/Overview: index.md/' docs/api/.pages
        python - <<'PY'
        from pathlib import Path

        for path in Path("docs/api").glob("*.md"):
            content = path.read_text(encoding="utf-8")
            normalized = "\n".join(line.rstrip() for line in content.splitlines()) + "\n"
            path.write_text(normalized, encoding="utf-8")
        PY
        
        echo "API documentation generated successfully (CLI adapters excluded)"

    - name: 🔎 Verify public API coverage
      run: |
        python - <<'PY'
        from pathlib import Path

        import adabmDCA
        import adabmDCA.api

        exports = {**adabmDCA._EXPORTS, **adabmDCA.api._EXPORTS}
        missing = []
        for symbol, module in sorted(exports.items()):
            page = Path("docs/api") / f"{module}.md"
            if not page.exists():
                missing.append(f"{symbol}: missing {page}")
                continue
            content = page.read_text(encoding="utf-8")
            if f"`{symbol}`" not in content and f"**{symbol}**" not in content:
                missing.append(f"{symbol}: absent from {page}")
        if missing:
            raise SystemExit("Public API documentation is incomplete:\n" + "\n".join(missing))
        print(f"Verified documentation for {len(exports)} public exports")
        PY

    - name: 📋 List generated files
      run: |
        echo "Generated API documentation files:"
        ls -la docs/api/

    - name: 💾 Commit and push changes
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/api/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "docs: regenerate API documentation with lazydocs [skip ci]"
          git push
          echo "Documentation changes committed and pushed ✅"
        fi

    - name: 📤 Upload documentation artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-documentation
        path: docs/api/
        retention-days: 30
