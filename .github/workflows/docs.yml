name: Documentation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Commit regenerated API pages; push the site to gh-pages

# Queue rather than cancel: a cancelled run could stop between commit and deploy.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Importing the package is all lazydocs needs: the CPU wheel skips the CUDA libraries.
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install lazydocs -e . --group docs

    - name: 🗑️ Clean existing API docs
      run: |
        find docs/api -maxdepth 1 -type f -name '*.md' ! -name 'index.md' -delete
        echo "Removed existing API documentation files"

    - name: 📝 Generate API documentation with lazydocs
      run: |
        # Generate one page per listed module, including package __init__ modules.
        # Keep private implementation modules out of this list.
        python tools/lazydocs_rst.py \
          --output-path docs/api \
          --overview-file symbols.md \
          --src-base-url "https://github.com/spqb/adabmDCApy/blob/main/" \
          adabmDCA.alphabet \
          adabmDCA.alignment \
          adabmDCA.input_loading \
          adabmDCA.preprocessing \
          adabmDCA.training.config \
          adabmDCA.training.control \
          adabmDCA.api.comparison \
          adabmDCA.api.contacts \
          adabmDCA.api.diagnostics \
          adabmDCA.api.entropy \
          adabmDCA.exceptions \
          adabmDCA.api.input_loading \
          adabmDCA.api.model \
          adabmDCA.api.ptt \
          adabmDCA.api.mutations \
          adabmDCA.api.reintegration \
          adabmDCA.api.results \
          adabmDCA.api.sampling \
          adabmDCA.api.scoring \
          adabmDCA.serialization \
          adabmDCA.api.splitting \
          adabmDCA.training.api \
          adabmDCA.checkpoint \
          adabmDCA.cobalt \
          adabmDCA.dataset \
          adabmDCA.dca \
          adabmDCA.fasta \
          adabmDCA.functional \
          adabmDCA.graph \
          adabmDCA.io \
          adabmDCA.plot \
          adabmDCA.ptt.config \
          adabmDCA.ptt.mixing \
          adabmDCA.ptt.sampler \
          adabmDCA.resampling \
          adabmDCA.cuda_kernels.sampling \
          adabmDCA.cuda_kernels.sampling_triton \
          adabmDCA.statmech \
          adabmDCA.steering \
          adabmDCA.steering.sampling \
          adabmDCA.steering.support \
          adabmDCA.stats \
          adabmDCA.training \
          adabmDCA.utils

        python tools/postprocess_api_docs.py docs/api
        python - <<'PY'
        from pathlib import Path

        for path in Path("docs/api").glob("*.md"):
            content = path.read_text(encoding="utf-8")
            normalized = "\n".join(line.rstrip() for line in content.splitlines()) + "\n"
            path.write_text(normalized, encoding="utf-8")
        PY
        
        echo "API documentation generated successfully (CLI adapters excluded)"

    - name: 🔎 Verify public API coverage
      run: |
        python - <<'PY'
        from pathlib import Path

        import adabmDCA
        import adabmDCA.api

        exports = {**adabmDCA._EXPORTS, **adabmDCA.api._EXPORTS}
        missing = []
        for symbol, module in sorted(exports.items()):
            page = Path("docs/api") / f"{module}.md"
            if not page.exists():
                missing.append(f"{symbol}: missing {page}")
                continue
            content = page.read_text(encoding="utf-8")
            if f"`{symbol}`" not in content and f"**{symbol}**" not in content:
                missing.append(f"{symbol}: absent from {page}")
        if missing:
            raise SystemExit("Public API documentation is incomplete:\n" + "\n".join(missing))
        print(f"Verified documentation for {len(exports)} public exports")
        PY

    - name: 🏗️ Build the site (fails on broken links or nav entries)
      run: mkdocs build --strict

    - name: 📋 List generated files
      run: |
        echo "Generated API documentation files:"
        ls -la docs/api/

    - name: 💾 Commit and push changes
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/api/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "docs: regenerate API documentation with lazydocs [skip ci]"
          git push
          echo "Documentation changes committed and pushed ✅"
        fi

    # The public site documents the released version, so only main deploys.
    # Deploying here, after regeneration, publishes the API pages just built;
    # the commit above carries [skip ci] and triggers no further workflow.
    - name: 🚀 Deploy to GitHub Pages
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: mkdocs gh-deploy --force

    - name: 📤 Upload documentation artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-documentation
        path: docs/api/
        retention-days: 30
